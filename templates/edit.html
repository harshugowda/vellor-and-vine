{% extends "base.html" %}

{% block content %}

<section class="featured">

    <h2>Edit Product</h2>

    <form method="POST" class="product-form">

        <input
            type="text"
            name="name"
            value="{{ product.name }}"
            required>

        <input
            type="text"
            name="category"
            value="{{ product.category }}"
            required>

        <input
            type="number"
            step="0.01"
            name="price"
            value="{{ product.price }}"
            required>

        <textarea
            name="description">{{ product.description }}</textarea>

        <button type="submit">
            Update Product
        </button>

    </form>

</section>

{% endblock %}
