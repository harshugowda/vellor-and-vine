{% extends "base.html" %}

{% block content %}

<section class="featured">

    <h2>Create Account</h2>

    <form method="POST" class="product-form">

        <input
            type="text"
            name="name"
            placeholder="Full Name"
            required>

        <input
            type="email"
            name="email"
            placeholder="Email Address"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <button type="submit">
            Register
        </button>

    </form>

</section>

{% endblock %}
